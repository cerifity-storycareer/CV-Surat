<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perapikan Teks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #333; margin-bottom: 30px; }
    textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 15px; resize: vertical; }
    select, button { padding: 10px 20px; border-radius: 6px; font-size: 15px; cursor: pointer; }
    select { border: 2px solid #ddd; background: white; margin-right: 10px; }
    button { background: #2c3e50; color: white; border: none; font-weight: bold; }
    .hasil-box { margin-top: 25px; padding: 20px; background: white; border-radius: 8px; border-left: 4px solid #2c3e50; min-height: 60px; }
    .label { font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>📝 Perapikan Teks</h1>
  <textarea id="inputTeks" placeholder="Tulis atau tempel teks di sini..."></textarea>
  <select id="gaya">
    <option value="standar">Gaya Standar</option>
    <option value="resmi">Gaya Resmi / Formal</option>
  </select>
  <button id="btnProses">✨ Rapikan Teks</button>
  <div class="hasil-box">
    <div class="label">Hasil Perapikan:</div>
    <p id="hasil"></p>
  </div>

  <script>
    const daftarPerbaikan = [
      { cari: /\bg\b/g, ganti: 'yang' },
      { cari: /\bsya\b/g, ganti: 'saya' },
      { cari: /\bpake\b/g, ganti: 'pakai' },
      { cari: /\bdlm\b/g, ganti: 'dalam' },
      { cari: /\bdt\b/g, ganti: 'dari' },
      { cari: /\bdgn\b/g, ganti: 'dengan' },
      { cari: /\bkrn\b/g, ganti: 'karena' },
      { cari: /\btdk\b/g, ganti: 'tidak' },
      { cari: /\bsdh\b/g, ganti: 'sudah' },
      { cari: /\bsblm\b/g, ganti: 'sebelum' },
      { cari: /\bskrg\b/g, ganti: 'sekarang' },
      { cari: /\bttg\b/g, ganti: 'tentang' },
      { cari: /\btrs\b/g, ganti: 'terus' },
      { cari: /\bap\b/g, ganti: 'apa' },
      { cari: /\bjg\b/g, ganti: 'juga' },
      { cari: /\bgak\b/g, ganti: 'tidak' },
      { cari: /\bdn\b/g, ganti: 'dan' },
    ];

    const aturanResmi = [
      { cari: /\bkayaknya\b/g, ganti: 'sepertinya' },
      { cari: /\bjadi\b/g, ganti: 'maka' },
    ];

    function rapikanTeks(teks, gaya) {
      let hasil = teks.trim();
      daftarPerbaikan.forEach(aturan => {
        hasil = hasil.replace(aturan.cari, aturan.ganti);
      });
      if (gaya === 'resmi') {
        aturanResmi.forEach(aturan => {
          hasil = hasil.replace(aturan.cari, aturan.ganti);
        });
      }
      hasil = hasil.replace(/\s+/g, ' ').trim();
      hasil = hasil.replace(/([.!?]\s+|^)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
      return hasil;
    }

    document.getElementById('btnProses').addEventListener('click', function() {
      const teks = document.getElementById('inputTeks').value;
      const gaya = document.getElementById('gaya').value;
      if (!teks) {
        alert('Silakan tulis teks terlebih dahulu ya!');
        return;
      }
      document.getElementById('hasil').textContent = rapikanTeks(teks, gaya);
    });
  </script>
</body>
</html>
